name: ros2-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Documentation and scene media integrity
        run: python3 scripts/check_docs.py
      - name: Register the ROS 2 APT repository
        timeout-minutes: 3
        shell: bash
        run: |
          # Skip setup-ros's anonymous latest-release lookup by installing the Noble package first.
          package="$(mktemp --suffix=.deb)"
          trap 'rm -f -- "$package"' EXIT
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 40 --output "$package" \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
          printf '%s  %s\n' f31d84adf5054c7d60ded0e82c0f776a77ea33af53d08f40b9ad7c94cca55296 "$package" \
            | sha256sum --check
          sudo dpkg --install "$package"
      - name: Configure ROS repositories and development tools
        uses: ros-tooling/setup-ros@v0.7
        timeout-minutes: 10
      - name: Install ROS base
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p artifacts
          sudo apt-get install --no-install-recommends -y ros-jazzy-ros-base 2>&1 | tee artifacts/ci-ros-base.log
      - name: Install declared dependencies
        timeout-minutes: 15
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y 2>&1 | tee artifacts/ci-dependencies.log
      - name: Build single-robot workspace
        run: bash scripts/build_ws.sh
      - name: Unit and Action fault-injection regression
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/test.sh 2>&1 | tee artifacts/ci-regression.log
      - name: Mock chassis motion and watchdog regression
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          source install-navcraft/local_setup.bash
          python3 scripts/test_mock_chassis.py 2>&1 | tee artifacts/ci-mock-chassis.log
      - name: Publish failure context
        if: ${{ failure() }}
        run: |
          python3 scripts/report_ci_failure.py \
            --log artifacts/ci-ros-base.log \
            --log artifacts/ci-dependencies.log \
            --log artifacts/ci-regression.log \
            --log artifacts/ci-mock-chassis.log
      - name: Upload regression diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ github.run_attempt }}
          path: |
            artifacts/navcraft-regression/
            artifacts/ci-ros-base.log
            artifacts/ci-dependencies.log
            artifacts/ci-regression.log
            artifacts/ci-mock-chassis.log
            log-navcraft/
            build-navcraft/**/test_results/
          if-no-files-found: ignore
          retention-days: 7
