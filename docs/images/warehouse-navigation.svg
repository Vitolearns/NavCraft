<text x="1430" y="790.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">顺序派发 · 有限重试 · 超时处理</text>
<text x="1430" y="819.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">暂停 / 恢复 / 取消 · 迟到回调收尾</text>
<text x="1430" y="848.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">下层结果未知 → FAULT，拒绝新任务</text>
