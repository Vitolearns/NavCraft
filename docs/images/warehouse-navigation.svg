<text x="715" y="1470.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">路径跟随 controller_server</text>
<text x="715" y="1510.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">Regulated Pure Pursuit · 20 Hz</text>
<text x="715" y="1539.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/plan + /odom + TF + 局部代价地图</text>
<text x="715" y="1568.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">速度调节与碰撞检测，目标速度 0.35 m/s</text>
<rect x="1080" y="1430" width="300" height="160" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1230" y="1485" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">恢复行为</text>
<text x="1230" y="1525" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">behavior_server</text>
<text x="1230" y="1554" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">旋转 / 后退 / 等待</text>
