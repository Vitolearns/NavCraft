<text x="715" y="1237.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">全局规划 planner_server</text>
<text x="715" y="1277.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">NavFn：Dijkstra 搜索（use_astar=false）</text>
<text x="715" y="1306.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">全局代价地图 → 可行路径 /plan</text>
