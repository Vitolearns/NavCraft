<text x="1230" y="1277.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">bt_navigator</text>
<text x="1230" y="1306.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">NavigateToPose Action</text>
