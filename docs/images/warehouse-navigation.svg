<text x="975" y="1827" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">路径跟随或恢复行为产生 Twist</text>
<rect x="1470" y="1745" width="260" height="105" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1600" y="1787" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">导航急停</text>
<text x="1600" y="1827" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/emergency_stop</text>
<rect x="620" y="1970" width="850" height="195" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1045" y="2028" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">navcraft_safety · 导航速度门</text>
<text x="1045" y="2068" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">仅 RUNNING 放行；状态心跳与速度各自 &lt; 300 ms</text>
<text x="1045" y="2097" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">锁存急停 · 拒绝非有限值 · 限幅 ±0.5 m/s、±1.2 rad/s</text>
<text x="1045" y="2126" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">暂停 / 取消 / FAULT / 超时 → 零速；解除急停需要新速度</text>
