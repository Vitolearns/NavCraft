<text x="900" y="524.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">连续里程计参考系</text>
<rect x="650" y="690" width="500" height="110" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="900" y="734.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">base_footprint</text>
<text x="900" y="774.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">底盘在地面上的投影坐标系</text>
<rect x="650" y="940" width="500" height="110" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="900" y="984.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">base_link</text>
<text x="900" y="1024.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">机器人实体参考系</text>
<rect x="45" y="1260" width="310" height="155" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="200" y="1314" font-size="23" font-weight="700" fill="#00569b" text-anchor="middle">lidar_link</text>
<text x="200" y="1351" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">xyz=(0.18, 0, 0.27) m</text>
<text x="200" y="1380" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">固定安装 · /tf_static</text>
<rect x="395" y="1260" width="310" height="155" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="550" y="1314" font-size="23" font-weight="700" fill="#00569b" text-anchor="middle">imu_link</text>
<text x="550" y="1351" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">xyz=(0, 0, 0.22) m</text>
<text x="550" y="1380" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">固定安装 · /tf_static</text>
<rect x="745" y="1260" width="310" height="155" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="900" y="1314" font-size="23" font-weight="700" fill="#00569b" text-anchor="middle">camera_link</text>
<text x="900" y="1351" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">xyz=(0.28, 0, 0.20) m</text>
<text x="900" y="1380" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">无独立 optical frame</text>
<rect x="1095" y="1260" width="310" height="155" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1250" y="1314" font-size="23" font-weight="700" fill="#00569b" text-anchor="middle">caster_wheel</text>
<text x="1250" y="1351" font-size="19.9713" font-weight="400" fill="#00569b" text-anchor="middle">xyz=(-0.20, 0, -0.035) m</text>
<text x="1250" y="1380" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">固定安装 · /tf_static</text>
<rect x="1445" y="1260" width="310" height="155" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1600" y="1314" font-size="23" font-weight="700" fill="#00569b" text-anchor="middle">left / right_wheel</text>
<text x="1600" y="1351" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">可动轮关节 · /tf</text>
<text x="1600" y="1380" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">当前 joint_states 供显示</text>
<rect x="60" y="1595" width="800" height="220" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2" stroke-dasharray="8 6"/>
<text x="460" y="1651" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">可选底盘：替换 odom 发布责任</text>
<text x="460" y="1691" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">直接驱动：底盘节点提供 odom 与 TF</text>
<text x="460" y="1720" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">EKF：关闭驱动发布，由 EKF 独占 odom TF</text>
<text x="460" y="1749" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">ros2_control：差速控制器负责 odom TF</text>
<text x="460" y="1778" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">三者均为独立入口，不与默认 Gazebo 同开</text>
<rect x="940" y="1595" width="800" height="220" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1340" y="1651" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">与导航 TF 分开的关系</text>
<text x="1340" y="1691" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">独立跟踪只用 odom，无需 map → odom</text>
<text x="1340" y="1720" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">PosePublisher → /warehouse_ground_truth 仅验收</text>
<text x="1340" y="1749" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">绝不把 Gazebo 世界位置灌入 /tf</text>
<text x="1340" y="1778" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">轮式 odom 偏离需单独评价，不能以真值替换</text>
<rect x="727.5" y="344" width="345" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="900" y="370" font-size="20" font-weight="700" fill="#00569b" text-anchor="middle">map → odom：定位 / 建图二选一</text>
<rect x="738" y="594" width="324" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="900" y="620" font-size="20" font-weight="700" fill="#00569b" text-anchor="middle">gazebo_odom_tf_node · /tf</text>
<rect x="654" y="844" width="492" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="900" y="870" font-size="20" font-weight="700" fill="#00569b" text-anchor="middle">robot_state_publisher · 固定 z = 0.075 m</text>
<rect x="712" y="1137" width="376" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="900" y="1163" font-size="21" font-weight="700" fill="#00569b" text-anchor="middle">robot_state_publisher + URDF</text>
<text x="900" y="1485" font-size="22" font-weight="400" fill="#536c7f" text-anchor="middle">安装 xyz 相对 base_link；joint_state_publisher 未接入 Gazebo 真实轮关节反馈</text>
<text x="900" y="1903" font-size="18" font-weight="400" fill="#64798b" text-anchor="middle">实线：数据 / 控制流    ·    虚线：启动选择 / 可选关系    ·    依据当前 launch 与配置</text>
</g></svg>
