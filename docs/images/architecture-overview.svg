<text x="250" y="737.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">导航速度保护</text>
<text x="250" y="777.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">navcraft_safety</text>
<text x="250" y="806.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">任务状态 · 超时 · 急停</text>
