<rect x="70" y="230" width="280" height="125" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="210" y="267.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">激光雷达</text>
<text x="210" y="307.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">gpu_lidar · 10 Hz</text>
<text x="210" y="336.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">360 点 · 0.08–12 m</text>
<rect x="390" y="230" width="280" height="125" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="530" y="267.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">IMU</text>
<text x="530" y="307.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">imu · 100 Hz</text>
<text x="530" y="336.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">姿态与惯性观测</text>
<rect x="710" y="230" width="300" height="125" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="860" y="267.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">相机</text>
<text x="860" y="307.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">15 Hz · 640×480</text>
<text x="860" y="336.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">默认开启</text>
<rect x="70" y="440" width="280" height="130" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="210" y="480" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">激光规范与过滤</text>
<text x="210" y="520" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/sim/scan → /scan</text>
<text x="210" y="549" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">lidar_link</text>
<rect x="390" y="440" width="280" height="130" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="530" y="480" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">IMU 帧名适配</text>
<text x="530" y="520" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/sim/imu → /imu/data</text>
<text x="530" y="549" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">仅规范 imu_link</text>
<rect x="710" y="440" width="300" height="130" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="860" y="480" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">图像桥接</text>
<text x="860" y="520" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/sim/camera/image</text>
<text x="860" y="549" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">无视觉处理节点</text>
<rect x="400" y="655" width="610" height="110" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="705" y="699.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">IMU / 相机：观察与验收</text>
<text x="705" y="739.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">未接入默认 AMCL、Nav2 或两套 SLAM</text>
<rect x="1170" y="170" width="560" height="115" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1450" y="217" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">演示入口 demo.sh</text>
<text x="1450" y="257" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">up 启动；warehouse / run 才提交导航任务</text>
<rect x="1170" y="385" width="560" height="150" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1450" y="435" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">启动编排 navcraft_bringup</text>
<text x="1450" y="475" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">launch_demo.py → navcraft.launch.py</text>
<text x="1450" y="504" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">ROS 域锁 · Gazebo 分区 · 子进程回收</text>
<rect x="70" y="820" width="350" height="145" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="245" y="867.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">轮式里程计 /odom</text>
<text x="245" y="907.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">DiffDrive → odom 适配</text>
<text x="245" y="936.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">输出平面位姿与速度</text>
<rect x="480" y="820" width="530" height="145" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="745" y="867.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">TF 坐标关系</text>
<text x="745" y="907.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">odom → base_footprint + URDF 安装 TF</text>
<text x="745" y="936.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">map → odom 由定位 / 建图分支负责</text>
<rect x="390" y="1170" width="410" height="170" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="595" y="1230" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">导航模式</text>
<text x="595" y="1270" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">有限航点任务 → AMCL + Nav2</text>
<text x="595" y="1299" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">激光、odom 与 TF；已有地图</text>
<rect x="850" y="1170" width="400" height="170" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1050" y="1215.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">建图模式</text>
<text x="1050" y="1255.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">SLAM Toolbox / Cartographer</text>
<text x="1050" y="1284.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">激光 + odom / TF → /map</text>
<text x="1050" y="1313.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">只建图；探索运动来自遥控</text>
<rect x="1300" y="1170" width="400" height="170" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1500" y="1215.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">独立跟踪模式</text>
<text x="1500" y="1255.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">Pure Pursuit / Stanley</text>
<text x="1500" y="1284.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/reference_path + /odom</text>
<text x="1500" y="1313.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">无全局规划、无激光避障</text>
<rect x="390" y="1480" width="410" height="200" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="595" y="1524.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">导航速度保护</text>
<text x="595" y="1556.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">navcraft_safety</text>
<text x="595" y="1596.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">RUNNING 状态 · 300 ms 新鲜度</text>
<text x="595" y="1625.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">锁存急停 /emergency_stop</text>
<text x="595" y="1654.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">限速 ±0.5 m/s、±1.2 rad/s</text>
<rect x="850" y="1480" width="400" height="135" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1050" y="1522.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">人工遥控</text>
<text x="1050" y="1562.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">键盘 /teleop_cmd_vel</text>
<text x="1050" y="1591.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">用于建图，也可接管独立跟踪</text>
<rect x="1300" y="1480" width="400" height="200" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1500" y="1540.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">实验仲裁与速度保护</text>
<text x="1500" y="1580.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">twist_mux → /muxed_cmd_vel</text>
<text x="1500" y="1609.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">navcraft_teleop 速度门</text>
<text x="1500" y="1638.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">急停 /enable_emergency_stop</text>
<rect x="820" y="1810" width="700" height="110" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1170" y="1854.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">唯一最终速度输出 /cmd_vel</text>
<text x="1170" y="1894.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">导航门或实验门，按模式互斥发布</text>
<rect x="820" y="2000" width="700" height="135" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1170" y="2042.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">默认执行端：Gazebo 差速机器人</text>
<text x="1170" y="2082.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">ros_gz_bridge → DiffDrive → 车轮运动</text>
<text x="1170" y="2111.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">Serial / UDP / mock / ros2_control 为独立替代入口</text>
<rect x="70" y="1810" width="560" height="140" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="350" y="1855" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">RViz 可视化</text>
<text x="350" y="1895" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">地图、定位、激光、全局路径与碰撞检查弧</text>
<text x="350" y="1924" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">默认统一入口仅导航分支使用 use_rviz</text>
<text x="545" y="199" font-size="25" font-weight="700" fill="#3d5568" text-anchor="middle">传感器：分别产生数据，不等于全部参与导航</text>
<text x="1050" y="1139" font-size="25" font-weight="700" fill="#3d5568" text-anchor="middle"></text>
<text x="1050" y="1366" font-size="22" font-weight="400" fill="#536c7f" text-anchor="middle">三种互斥运行模式：mode = navigation / slam / tracking</text>
<rect x="1371" y="697" width="158" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="1450" y="723" font-size="21" font-weight="700" fill="#00569b" text-anchor="middle">mode 三选一</text>
<rect x="162.5" y="692" width="95" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="210" y="718" font-size="21" font-weight="700" fill="#00569b" text-anchor="middle">/scan</text>
<rect x="470.5" y="1397" width="249" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="595" y="1423" font-size="19" font-weight="700" fill="#00569b" text-anchor="middle">/nav2_cmd_vel + 状态</text>
<rect x="1389" y="1397" width="222" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="1500" y="1423" font-size="19" font-weight="700" fill="#00569b" text-anchor="middle">/tracking_cmd_vel</text>
<rect x="233" y="2044" width="214" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="340" y="2070" font-size="20" font-weight="700" fill="#00569b" text-anchor="middle">仿真观测与运动反馈</text>
<text x="1060" y="1708" font-size="19" font-weight="400" fill="#536c7f" text-anchor="middle">SLAM 输出地图，人工遥控提供运动速度</text>
<text x="900" y="2173" font-size="18" font-weight="400" fill="#64798b" text-anchor="middle">实线：数据 / 控制流    ·    虚线：启动选择 / 可选关系    ·    依据当前 launch 与配置</text>
</g></svg>
