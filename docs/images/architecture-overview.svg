<text x="720" y="777.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">twist_mux → navcraft_teleop</text>
<text x="720" y="806.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">输入超时 · 急停</text>
