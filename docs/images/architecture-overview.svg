<text x="1190" y="806.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">输入超时 · 急停</text>
<rect x="240" y="955" width="960" height="125" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="720" y="992.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">Gazebo 仓库 · 差速机器人</text>
<text x="720" y="1032.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/cmd_vel → ros_gz_bridge → DiffDrive</text>
<text x="720" y="1061.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">导航反馈：轮速 + IMU → /odom · 激光 + 深度 → 代价地图</text>
<text x="250" y="349" font-size="25" font-weight="700" fill="#3d5568" text-anchor="middle">navigation · 已有地图导航</text>
<text x="720" y="349" font-size="25" font-weight="700" fill="#3d5568" text-anchor="middle">slam · 激光建图</text>
<text x="1190" y="349" font-size="25" font-weight="700" fill="#3d5568" text-anchor="middle">tracking · 独立路径跟踪</text>
<rect x="131" y="567" width="238" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="250" y="593" font-size="18" font-weight="700" fill="#00569b" text-anchor="middle">/nav2_cmd_vel + 状态</text>
<rect x="1079" y="567" width="222" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="1190" y="593" font-size="19" font-weight="700" fill="#00569b" text-anchor="middle">/tracking_cmd_vel</text>
<rect x="562.5" y="864" width="315" height="38" rx="19" fill="#f6fbff" stroke="#cfdeeb" stroke-width="1.7"/>
<text x="720" y="890" font-size="21" font-weight="700" fill="#00569b" text-anchor="middle">/cmd_vel · 唯一最终发布者</text>
<text x="720" y="1118" font-size="19" font-weight="400" fill="#536c7f" text-anchor="middle">建图与独立跟踪使用轮式里程计。Serial / UDP / mock / ros2_control 另行启动。</text>
<text x="720" y="1143" font-size="18" font-weight="400" fill="#64798b" text-anchor="middle">实线：数据 / 控制流    ·    虚线：启动选择 / 可选关系    ·    依据当前 launch 与配置</text>
