<text x="250" y="412.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">航点任务 · AMCL · Nav2</text>
<text x="250" y="452.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">地图 + 激光 + 融合里程计</text>
<text x="250" y="481.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">激光 / 深度避障，执行航点任务</text>
<rect x="530" y="370" width="380" height="135" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="720" y="412.5" font-size="22.2222" font-weight="700" fill="#00569b" text-anchor="middle">SLAM Toolbox / Cartographer</text>
<text x="720" y="452.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/scan + odom / TF → /map</text>
<text x="720" y="481.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">只建图，不产生运动速度</text>
<rect x="1000" y="370" width="380" height="135" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="1190" y="412.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">Pure Pursuit / Stanley</text>
<text x="1190" y="452.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/reference_path + /odom</text>
<text x="1190" y="481.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">跟随预设路径，无自主避障</text>
<rect x="530" y="555" width="380" height="100" rx="25" fill="#e4f3ff" stroke="#cfdae3" stroke-width="2"/>
<text x="720" y="594.5" font-size="25" font-weight="700" fill="#00569b" text-anchor="middle">键盘遥控</text>
<text x="720" y="634.5" font-size="21" font-weight="400" fill="#00569b" text-anchor="middle">/teleop_cmd_vel</text>
