<rect x="-0.6" y="-0.225" width="1.2" height="0.45" transform="translate(1.5 1.5) rotate(17.1887)"/>
<rect x="-0.6" y="-0.25" width="1.2" height="0.5" transform="translate(-2 2) rotate(-22.9183)"/>
<rect x="-0.4" y="-0.7" width="0.8" height="1.4" transform="translate(2 -2) rotate(0)"/>
<rect x="-0.425" y="-0.275" width="0.85" height="0.55" transform="translate(-3.9 -3.8) rotate(0)"/>
</g>
<circle cx="-73.6" cy="-9.2" r="9" fill="#85e5c9" stroke="#101e2d"/>
<text x="-73.6" y="-5.2" text-anchor="middle" font-size="11" font-weight="700" fill="#132c31">1</text>
<circle cx="-46" cy="-69" r="9" fill="#85e5c9" stroke="#101e2d"/>
