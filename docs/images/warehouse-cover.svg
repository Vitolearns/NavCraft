<circle cx="73.6" cy="46" r="9" fill="#85e5c9" stroke="#101e2d"/>
<text x="73.6" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#132c31">4</text>
<circle cx="-73.6" cy="73.6" r="9" fill="#85e5c9" stroke="#101e2d"/>
<text x="-73.6" y="77.6" text-anchor="middle" font-size="11" font-weight="700" fill="#132c31">5</text>
<circle cx="0" cy="-0" r="9" fill="#85e5c9" stroke="#101e2d"/>
