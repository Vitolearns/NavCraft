navigation_ekf:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # Body-frame wheel velocities (including the nonholonomic lateral constraint).
    # The encoder pose comes from the same wheels and is already integrated.
    odom0: /wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    # Gyro yaw rate supplies an independent measurement during turns.
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 20
